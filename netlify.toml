# Netlify: continuous deployment from GitHub.
#   push to main → production (nokgrid-blocks.netlify.app)
#   pull request → Deploy Preview
# Netlify detects Next.js and applies its Next.js runtime automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
